<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NEO OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --neo-bg: #050505;
      --neo-surface: #111111;
      --neo-border: rgba(255,255,255,0.08);
      --neo-border-strong: rgba(255,255,255,0.15);
      --neo-text: #f0f0f0;
      --neo-text-muted: rgba(255,255,255,0.45);
      --neo-accent: #4f8ef7;
      --neo-accent-glow: rgba(79,142,247,0.2);
      --neo-green: #22c55e;
      --neo-red: #ef4444;
      --neo-amber: #f59e0b;
      --bar-h: 28px;
      --dock-h: 72px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono: 'SF Mono', 'Fira Mono', monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--neo-bg);
      color: var(--neo-text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── BOOT SCREEN ── */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 32px;
    }
    .boot-logo {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700; letter-spacing: -2px;
      color: var(--neo-accent);
      border: 1px solid rgba(79,142,247,0.3);
      animation: logoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }
    .boot-wordmark {
      font-size: 22px; font-weight: 600; letter-spacing: 8px;
      color: #fff; text-transform: uppercase;
      animation: fadeUp 0.5s ease 0.8s both;
    }
    .boot-subtitle {
      font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      animation: fadeUp 0.5s ease 0.95s both;
    }
    .boot-bar-wrap {
      width: 180px; height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px; overflow: hidden;
      animation: fadeUp 0.4s ease 1.1s both;
    }
    .boot-bar {
      height: 100%; width: 0; border-radius: 2px;
      background: var(--neo-accent);
      animation: bootLoad 1.8s cubic-bezier(0.4,0,0.2,1) 1.2s forwards;
    }
    .boot-msg {
      font-size: 11px; color: rgba(255,255,255,0.3);
      font-family: var(--mono);
      min-height: 16px;
      animation: fadeUp 0.3s ease 1.1s both;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bootLoad {
      0%   { width: 0; }
      40%  { width: 45%; }
      70%  { width: 75%; }
      90%  { width: 92%; }
      100% { width: 100%; }
    }

    /* ── OS SHELL ── */
    #os {
      position: fixed; inset: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease;
      display: flex; flex-direction: column;
    }
    #os.visible { opacity: 1; pointer-events: all; }

    /* ── WALLPAPER ── */
    #wallpaper {
      position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 30%, #0f1b3a 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 70%, #0a1628 0%, transparent 55%),
                  radial-gradient(ellipse at 50% 50%, #050a15 0%, #050505 100%);
    }
    .star {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.6);
      animation: twinkle var(--t, 3s) ease-in-out infinite var(--d, 0s);
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.2; } 50% { opacity: 0.8; }
    }

    /* ── MENU BAR ── */
    #menubar {
      position: relative; z-index: 100;
      height: var(--bar-h);
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--neo-border);
      display: flex; align-items: center;
      padding: 0 12px;
      padding-left: calc(12px + var(--safe-left));
      padding-right: calc(12px + var(--safe-right));
      gap: 0; font-size: 12px;
    }
    .mb-logo {
      font-weight: 700; font-size: 13px; color: var(--neo-accent);
      letter-spacing: -0.5px; margin-right: 8px;
      cursor: default;
    }
    .mb-item {
      padding: 2px 8px; border-radius: 4px;
      cursor: default; color: rgba(255,255,255,0.85);
      transition: background 0.15s;
      white-space: nowrap;
    }
    .mb-item:hover { background: rgba(255,255,255,0.1); }
    .mb-item.active { background: rgba(255,255,255,0.12); }
    .mb-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 12px;
    }
    .mb-clock {
      font-size: 12px; color: var(--neo-text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
    }
    .mb-icon {
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.75; cursor: default;
    }
    .mb-icon svg { width: 14px; height: 14px; fill: currentColor; }
    .mb-icon:hover { opacity: 1; }

    /* ── DESKTOP ── */
    #desktop {
      flex: 1; position: relative; z-index: 1;
      overflow: hidden;
    }

    /* ── WINDOWS ── */
    .win {
      position: absolute;
      background: rgba(18,18,20,0.92);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      border: 1px solid var(--neo-border-strong);
      border-radius: var(--radius-lg);
      display: flex; flex-direction: column;
      min-width: 280px; min-height: 200px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7), 0 4px 16px rgba(0,0,0,0.5);
      transition: box-shadow 0.2s, opacity 0.25s, transform 0.25s;
      overflow: hidden;
    }
    .win.animating-in {
      animation: winIn 0.25s cubic-bezier(0.34,1.4,0.64,1) both;
    }
    .win.animating-out {
      animation: winOut 0.2s ease both;
    }
    @keyframes winIn {
      from { opacity: 0; transform: scale(0.88) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes winOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(0.9); }
    }
    .win:not(.minimized) + .win { box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 6px 24px rgba(0,0,0,0.6); }
    .win.focused { border-color: rgba(255,255,255,0.2); }
    .win.minimized { display: none; }

    .win-titlebar {
      height: 40px; min-height: 40px;
      display: flex; align-items: center;
      padding: 0 12px; gap: 8px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--neo-border);
      cursor: grab; flex-shrink: 0;
    }
    .win-titlebar:active { cursor: grabbing; }
    .win-btns { display: flex; gap: 6px; }
    .win-btn {
      width: 12px; height: 12px; border-radius: 50%;
      border: none; cursor: pointer; flex-shrink: 0;
      transition: filter 0.15s, transform 0.1s;
      position: relative;
    }
    .win-btn:hover { filter: brightness(1.3); }
    .win-btn:active { transform: scale(0.9); }
    .win-btn.close  { background: #ff5f57; }
    .win-btn.min    { background: #febc2e; }
    .win-btn.max    { background: #28c840; }
    .win-title {
      flex: 1; text-align: center;
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.75);
      pointer-events: none;
    }
    .win-body {
      flex: 1; overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    .win-body::-webkit-scrollbar { width: 6px; }
    .win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

    /* resize handle */
    .win-resize {
      position: absolute; right: 0; bottom: 0;
      width: 20px; height: 20px; cursor: nwse-resize;
      opacity: 0.3;
    }
    .win-resize::after {
      content: ''; position: absolute; right: 4px; bottom: 4px;
      width: 8px; height: 8px;
      border-right: 2px solid rgba(255,255,255,0.5);
      border-bottom: 2px solid rgba(255,255,255,0.5);
    }

    /* ── APP CONTENT AREAS ── */
    .app-terminal {
      padding: 12px; font-family: var(--mono); font-size: 12px;
      line-height: 1.7; color: #0dff9a;
      height: 100%;
    }
    .app-terminal .t-line { margin-bottom: 2px; }
    .app-terminal .t-prompt { color: var(--neo-accent); }
    .app-terminal .t-err { color: var(--neo-red); }
    .app-terminal .t-warn { color: var(--neo-amber); }
    .app-terminal .cursor {
      display: inline-block; width: 7px; height: 14px;
      background: #0dff9a; vertical-align: -2px;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .app-files {
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 4px;
    }
    .file-item {
      display: flex; flex-direction: column;
      align-items: center; padding: 8px 4px; gap: 6px;
      border-radius: var(--radius-sm); cursor: default;
      transition: background 0.15s;
    }
    .file-item:hover { background: rgba(255,255,255,0.08); }
    .file-item.selected { background: rgba(79,142,247,0.25); }
    .file-icon { font-size: 28px; line-height: 1; }
    .file-name { font-size: 11px; text-align: center; color: var(--neo-text); line-height: 1.3; word-break: break-word; }

    .app-settings { padding: 16px; }
    .setting-section { margin-bottom: 20px; }
    .setting-label {
      font-size: 11px; color: var(--neo-text-muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .setting-row {
      display: flex; align-items: center;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm);
      border: 1px solid var(--neo-border);
      margin-bottom: 4px; gap: 12px;
      font-size: 13px;
    }
    .setting-row .icon { font-size: 18px; }
    .setting-row .name { flex: 1; color: var(--neo-text); }
    .setting-row .val { font-size: 12px; color: var(--neo-text-muted); }
    .toggle {
      width: 36px; height: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px; position: relative;
      cursor: pointer; transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--neo-accent); }
    .toggle::after {
      content: ''; position: absolute;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; top: 2px; left: 2px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    .app-browser {
      display: flex; flex-direction: column; height: 100%;
    }
    .browser-bar {
      padding: 8px 10px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--neo-border);
      background: rgba(255,255,255,0.03);
    }
    .browser-url {
      flex: 1; background: rgba(255,255,255,0.07);
      border: 1px solid var(--neo-border);
      border-radius: 20px; padding: 5px 12px;
      font-size: 12px; color: var(--neo-text);
      font-family: var(--font); outline: none;
    }
    .browser-url:focus { border-color: var(--neo-accent); background: rgba(255,255,255,0.1); }
    .browser-content {
      flex: 1; display: flex; align-items: center;
      justify-content: center; color: var(--neo-text-muted);
      font-size: 13px; flex-direction: column; gap: 8px;
    }
    .browser-icon { font-size: 40px; opacity: 0.3; }
    .btn-sm {
      padding: 5px 10px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--neo-border);
      color: var(--neo-text); font-size: 12px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-sm:hover { background: rgba(255,255,255,0.14); }

    /* ── NOTIFICATION ── */
    #notif-area {
      position: absolute; top: 38px; right: 12px;
      z-index: 200; display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .notif {
      background: rgba(20,20,22,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--neo-border-strong);
      border-radius: var(--radius-md);
      padding: 10px 14px; min-width: 240px; max-width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      animation: notifIn 0.3s cubic-bezier(0.34,1.4,0.64,1) both,
                 notifOut 0.3s ease var(--hide-at, 3.5s) both;
      pointer-events: all;
    }
    @keyframes notifIn {
      from { opacity: 0; transform: translateX(40px) scale(0.95); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes notifOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(40px); }
    }
    .notif-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .notif-app { font-size: 11px; color: var(--neo-text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .notif-title { font-size: 13px; font-weight: 500; color: var(--neo-text); }
    .notif-body  { font-size: 12px; color: var(--neo-text-muted); line-height: 1.4; }

    /* ── DOCK ── */
    #dock {
      position: relative; z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0 20px calc(10px + var(--safe-bottom)) 20px;
      gap: 0; pointer-events: none;
    }
    .dock-inner {
      display: flex; align-items: flex-end;
      gap: 8px; padding: 8px 12px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--neo-border-strong);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      pointer-events: all;
    }
    .dock-divider {
      width: 1px; height: 36px;
      background: var(--neo-border);
      margin: 0 4px; align-self: center;
    }
    .dock-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      cursor: pointer; position: relative;
      --base-sz: 48px;
    }
    .dock-icon {
      width: var(--base-sz); height: var(--base-sz);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; line-height: 1;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1),
                  filter 0.15s;
      position: relative;
    }
    .dock-item:hover .dock-icon {
      transform: translateY(-10px) scale(1.18);
      filter: brightness(1.1);
    }
    .dock-item:active .dock-icon { transform: translateY(-4px) scale(1.05); }
    .dock-item .dock-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
      position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
    }
    .dock-tooltip {
      position: absolute; bottom: calc(100% + 10px);
      background: rgba(0,0,0,0.85); color: #fff;
      font-size: 11px; padding: 4px 8px; border-radius: 6px;
      white-space: nowrap; pointer-events: none;
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.15s, transform 0.15s;
    }
    .dock-item:hover .dock-tooltip { opacity: 1; transform: translateY(0); }

    /* ── HOME SCREEN (mobile fallback) ── */
    #homescreen {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 24px 16px;
      align-content: start;
    }
    .hs-icon {
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      cursor: pointer;
    }
    .hs-icon-img {
      width: 56px; height: 56px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.15s;
    }
    .hs-icon:active .hs-icon-img { transform: scale(0.92); }
    .hs-icon-label { font-size: 10px; color: var(--neo-text); text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

    /* ── LOADING SCREEN (CDN fallback) ── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 8888;
      background: #050505;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      opacity: 0; pointer-events: none;
    }
    #loading-screen.visible { opacity: 1; pointer-events: all; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--neo-accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #load-msg { font-size: 13px; color: var(--neo-text-muted); font-family: var(--mono); }
    #fallback-link {
      display: none; padding: 12px 28px;
      background: var(--neo-accent); color: #fff;
      border-radius: 999px; font-weight: 600;
      text-decoration: none; font-size: 14px;
      transition: filter 0.15s;
    }
    #fallback-link:hover { filter: brightness(1.1); }

    /* ── CONTEXT MENU ── */
    #ctx-menu {
      position: fixed; z-index: 500;
      background: rgba(22,22,24,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--neo-border-strong);
      border-radius: 10px; padding: 4px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
      display: none; min-width: 180px;
    }
    #ctx-menu.visible { display: block; }
    .ctx-item {
      padding: 8px 12px; font-size: 13px;
      border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      color: var(--neo-text); transition: background 0.1s;
    }
    .ctx-item:hover { background: var(--neo-accent); }
    .ctx-sep { height: 1px; background: var(--neo-border); margin: 4px 0; }

    /* ── STATUS BAR (mobile only) ── */
    #statusbar {
      display: none;
      height: 24px; padding: 0 12px;
      align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 600;
      background: rgba(0,0,0,0.6);
      position: relative; z-index: 100;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      :root { --bar-h: 24px; --dock-h: 64px; }
      #menubar { display: none; }
      #statusbar { display: flex; }
      .mb-clock { display: none; }
      .win {
        position: fixed !important;
        left: 0 !important; right: 0 !important;
        bottom: 0 !important;
        top: 24px !important;
        width: 100% !important; height: auto !important;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        border-bottom: none;
      }
      .win-resize { display: none; }
      .dock-inner { gap: 4px; padding: 6px 10px; }
      .dock-item { --base-sz: 42px; }
      .dock-icon { border-radius: 12px; font-size: 22px; }
      #homescreen { grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px 12px; }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
      .win { min-width: 320px; }
      .dock-item { --base-sz: 44px; }
    }

    @media (min-width: 1200px) {
      .dock-item { --base-sz: 52px; }
      .dock-icon { border-radius: 16px; font-size: 28px; }
    }

    /* print-safe */
    @media print { #boot, #os { display: none; } }
  </style>
</head>
<body>

<!-- ── BOOT ── -->
<div id="boot">
  <div class="boot-logo">N</div>
  <div>
    <div class="boot-wordmark">NEO OS</div>
    <div class="boot-subtitle" style="text-align:center;margin-top:4px">Version 2.0 · Responsive Edition</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <div class="boot-bar-wrap"><div class="boot-bar"></div></div>
    <div class="boot-msg" id="boot-msg">Initializing kernel…</div>
  </div>
</div>

<!-- ── OS ── -->
<div id="os">
  <!-- Wallpaper -->
  <div id="wallpaper"></div>

  <!-- Status bar (mobile) -->
  <div id="statusbar">
    <span id="sb-time">12:00</span>
    <span style="display:flex;gap:10px;align-items:center">
      <span id="sb-battery">🔋</span>
      <span>📶</span>
    </span>
  </div>

<script>
(function() {
  "use strict";

  /* ── BOOT MESSAGES ── */
  var bootMsgs = [
    "Initializing kernel…",
    "Loading system drivers…",
    "Mounting file systems…",
    "Starting window manager…",
    "Loading user interface…",
    "Welcome to NEO OS"
  ];
  var bootEl = document.getElementById("boot-msg");
  var mi = 0;
  var msgInterval = setInterval(function() {
    mi++;
    if (mi < bootMsgs.length) bootEl.textContent = bootMsgs[mi];
    else clearInterval(msgInterval);
  }, 520);

  /* ── CLOCK ── */
  function updateClock() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    var ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    var str = h + ":" + (m < 10 ? "0" : "") + m + " " + ampm;
    var clk = document.getElementById("clock");
    var sb  = document.getElementById("sb-time");
    if (clk) clk.textContent = str;
    if (sb)  sb.textContent  = str;
  }
  updateClock();
  setInterval(updateClock, 30000);

  /* ── STARS ── */
  var wp = document.getElementById("wallpaper");
  for (var i = 0; i < 80; i++) {
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random() * 1.5 + 0.5;
    s.style.cssText = "width:" + sz + "px;height:" + sz + "px;"
      + "top:" + (Math.random()*100) + "%;"
      + "left:" + (Math.random()*100) + "%;"
      + "--t:" + (2 + Math.random()*4) + "s;"
      + "--d:-" + (Math.random()*3) + "s;";
    wp.appendChild(s);
  }

  /* ── DOCK APPS ── */
  var APPS = [
    { id:"finder",   icon:"🗂",  label:"Finder",   color:"#1c7ed6" },
    { id:"terminal", icon:"💻",  label:"Terminal",  color:"#2f9e44" },
    { id:"browser",  icon:"🌐",  label:"Browser",   color:"#1971c2" },
    { id:"files",    icon:"📁",  label:"Files",     color:"#e67700" },
    { id:"settings", icon:"⚙️",  label:"Settings",  color:"#495057" },
  ];
  var SYSTEM = [
    { id:"trash",    icon:"🗑",  label:"Trash",    color:"#343a40" },
  ];

  function buildDock() {
    var di = document.getElementById("dock-inner");
    di.innerHTML = "";
    APPS.forEach(function(app) { di.appendChild(makeDockItem(app)); });
    var div = document.createElement("div"); div.className = "dock-divider";
    di.appendChild(div);
    SYSTEM.forEach(function(app) { di.appendChild(makeDockItem(app)); });
  }

  function makeDockItem(app) {
    var el = document.createElement("div");
    el.className = "dock-item";
    el.id = "dock-" + app.id;
    el.innerHTML = '<div class="dock-icon" style="background:' + app.color + '22;border:1px solid ' + app.color + '33">'
      + app.icon + '</div>'
      + '<div class="dock-tooltip">' + app.label + '</div>';
    el.addEventListener("click", function() { openApp(app.id); });
    return el;
  }
  buildDock();

  /* ── WINDOW MANAGER ── */
  var wins = {};
  var zTop = 10;
  var isMobile = window.innerWidth <= 600;

  window.addEventListener("resize", function() {
    isMobile = window.innerWidth <= 600;
  });

  var defaultPositions = {
    finder:   { x: 40,  y: 30,  w: 560, h: 380 },
    terminal: { x: 120, y: 60,  w: 560, h: 340 },
    browser:  { x: 80,  y: 50,  w: 620, h: 400 },
    files:    { x: 200, y: 80,  w: 500, h: 360 },
    settings: { x: 160, y: 40,  w: 480, h: 400 },
    trash:    { x: 300, y: 100, w: 360, h: 280 },
  };

  window.openApp = function(id) {
    hideCtxMenu();
    if (wins[id]) {
      var w = wins[id];
      if (w.minimized) { w.minimized = false; w.el.classList.remove("minimized"); }
      focusWin(id);
      return;
    }
    createWindow(id);
    updateDockDot(id, true);
    if (id === "finder") updateMenuTitle("Finder");
  };

  function createWindow(id) {
    var pos = defaultPositions[id] || { x: 60, y: 60, w: 500, h: 360 };
    var el = document.createElement("div");
    el.className = "win animating-in";
    el.id = "win-" + id;
    el.style.cssText = isMobile ? "" :
      "left:" + pos.x + "px;top:" + pos.y + "px;"
      + "width:" + pos.w + "px;height:" + pos.h + "px;";
    el.style.zIndex = ++zTop;
    el.innerHTML = buildWinHTML(id);
    document.getElementById("desktop").appendChild(el);

    var state = wins[id] = { el: el, minimized: false, id: id };
    setTimeout(function() { el.classList.remove("animating-in"); }, 300);

    /* titlebar drag */
    var tb = el.querySelector(".win-titlebar");
    if (!isMobile) makeDraggable(el, tb);

    /* resize */
    var rz = el.querySelector(".win-resize");
    if (rz && !isMobile) makeResizable(el, rz);

    /* buttons */
    el.querySelector(".win-btn.close").addEventListener("click", function(e) {
      e.stopPropagation();
      closeWin(id);
    });
    el.querySelector(".win-btn.min").addEventListener("click", function(e) {
      e.stopPropagation();
      minWin(id);
    });
    el.querySelector(".win-btn.max").addEventListener("click", function(e) {
      e.stopPropagation();
      maxWin(id, el);
    });

    el.addEventListener("mousedown", function() { focusWin(id); });
    el.addEventListener("touchstart", function() { focusWin(id); }, { passive: true });

    initWinContent(id, el);
    focusWin(id);
  }

  function buildWinHTML(id) {
    var titles = {
      finder:"Finder", terminal:"Terminal", browser:"Browser",
      files:"Files", settings:"System Settings", trash:"Trash"
    };
    return '<div class="win-titlebar">'
      + '<div class="win-btns">'
      + '<button class="win-btn close" aria-label="Close"></button>'
      + '<button class="win-btn min" aria-label="Minimize"></button>'
      + '<button class="win-btn max" aria-label="Expand"></button>'
      + '</div>'
      + '<div class="win-title">' + (titles[id] || id) + '</div>'
      + '<div style="width:52px"></div>'
      + '</div>'
      + '<div class="win-body" id="win-body-' + id + '"></div>'
      + '<div class="win-resize" aria-hidden="true"></div>';
  }

  function initWinContent(id, el) {
    var body = el.querySelector(".win-body");
    if (id === "terminal") initTerminal(body);
    else if (id === "files" || id === "finder") initFiles(body, id);
    else if (id === "settings") initSettings(body);
    else if (id === "browser") initBrowser(body);
    else if (id === "trash") initTrash(body);
  }

  function closeWin(id) {
    var s = wins[id]; if (!s) return;
    s.el.classList.add("animating-out");
    setTimeout(function() {
      if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
      delete wins[id];
      updateDockDot(id, false);
    }, 200);
  }

  function minWin(id) {
    var s = wins[id]; if (!s) return;
    s.minimized = true; s.el.classList.add("minimized");
  }

  function maxWin(id, el) {
    if (el.dataset.maximized === "1") {
      el.style.left   = el.dataset.ox + "px";
      el.style.top    = el.dataset.oy + "px";
      el.style.width  = el.dataset.ow + "px";
      el.style.height = el.dataset.oh + "px";
      el.dataset.maximized = "0";
    } else {
      var dt = document.getElementById("desktop");
      el.dataset.ox = el.offsetLeft;
      el.dataset.oy = el.offsetTop;
      el.dataset.ow = el.offsetWidth;
      el.dataset.oh = el.offsetHeight;
      el.style.left = "0"; el.style.top = "0";
      el.style.width = dt.offsetWidth + "px";
      el.style.height = dt.offsetHeight + "px";
      el.dataset.maximized = "1";
    }
  }

  function focusWin(id) {
    Object.keys(wins).forEach(function(k) {
      wins[k].el.classList.remove("focused");
    });
    if (wins[id]) {
      wins[id].el.classList.add("focused");
      wins[id].el.style.zIndex = ++zTop;
    }
  }

  function updateDockDot(id, show) {
    var item = document.getElementById("dock-" + id);
    if (!item) return;
    var dot = item.querySelector(".dock-dot");
    if (show && !dot) {
      var d = document.createElement("div"); d.className = "dock-dot";
      item.querySelector(".dock-icon").appendChild(d);
    } else if (!show && dot) {
      dot.parentNode.removeChild(dot);
    }
  }

  function updateMenuTitle(t) {
    var mb = document.getElementById("mb-finder");
    if (mb) mb.textContent = t;
  }

  /* ── DRAGGABLE ── */
  function makeDraggable(win, handle) {
    var dx, dy, dragging = false;
    handle.addEventListener("mousedown", function(e) {
      if (e.target.classList.contains("win-btn")) return;
      dragging = true;
      dx = e.clientX - win.offsetLeft;
      dy = e.clientY - win.offsetTop;
      e.preventDefault();
    });
    document.addEventListener("mousemove", function(e) {
      if (!dragging) return;
      var nx = e.clientX - dx;
      var ny = e.clientY - dy;
      var dt = document.getElementById("desktop");
      nx = Math.max(0, Math.min(nx, dt.offsetWidth - win.offsetWidth));
      ny = Math.max(0, Math.min(ny, dt.offsetHeight - 40));
      win.style.left = nx + "px";
      win.style.top  = ny + "px";
    });
    document.addEventListener("mouseup", function() { dragging = false; });
  }

  /* ── RESIZABLE ── */
  function makeResizable(win, handle) {
    var ox, oy, ow, oh, resizing = false;
    handle.addEventListener("mousedown", function(e) {
      resizing = true;
      ox = e.clientX; oy = e.clientY;
      ow = win.offsetWidth; oh = win.offsetHeight;
      e.preventDefault(); e.stopPropagation();
    });
    document.addEventListener("mousemove", function(e) {
      if (!resizing) return;
      win.style.width  = Math.max(280, ow + (e.clientX - ox)) + "px";
      win.style.height = Math.max(200, oh + (e.clientY - oy)) + "px";
    });
    document.addEventListener("mouseup", function() { resizing = false; });
  }

  /* ── CONTEXT MENU ── */
  var ctxMenu = document.getElementById("ctx-menu");
  window.showCtxMenu = function(e) {
    e.preventDefault();
    ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 200) + "px";
    ctxMenu.style.top  = Math.min(e.clientY, window.innerHeight - 200) + "px";
    ctxMenu.classList.add("visible");
  };
  window.hideCtxMenu = function() { ctxMenu.classList.remove("visible"); };
  document.addEventListener("click", hideCtxMenu);
  document.addEventListener("touchstart", hideCtxMenu, { passive: true });

  /* ── NOTIFICATIONS ── */
  var notifArea = document.getElementById("notif-area");
  function showNotif(app, title, body, delay) {
    delay = delay || 0;
    setTimeout(function() {
      var n = document.createElement("div");
      n.className = "notif";
      n.style.setProperty("--hide-at", "3.5s");
      n.innerHTML = '<div class="notif-header">'
        + '<span style="font-size:14px">' + app.icon + '</span>'
        + '<span class="notif-app">' + app.name + '</span>'
        + '</div>'
        + '<div class="notif-title">' + title + '</div>'
        + '<div class="notif-body">' + body + '</div>';
      notifArea.appendChild(n);
      setTimeout(function() { if (n.parentNode) n.parentNode.removeChild(n); }, 3900);
    }, delay);
  }

  window.showNewWallpaperNotif = function() {
    showNotif({icon:"🖼",name:"Wallpaper"}, "Wallpaper Updated", "Your desktop wallpaper has been changed.");
  };

  /* ── APP CONTENT ── */

  /* TERMINAL */
  function initTerminal(body) {
    body.className = "app-terminal";
    var lines = [
      { t:"prompt", text:"neo@os ~ % " },
      { t:"out",    text:"Welcome to NEO OS v2.0" },
      { t:"out",    text:'Type <span style="color:#4f8ef7">help</span> for available commands.' },
      { t:"blank" },
      { t:"prompt", text:"neo@os ~ % neofetch" },
      { t:"out",    text:'<span style="color:#4f8ef7">OS:</span>      NEO OS 2.0 Responsive' },
      { t:"out",    text:'<span style="color:#4f8ef7">Shell:</span>   neosh 1.0' },
      { t:"out",    text:'<span style="color:#4f8ef7">Display:</span> ' + window.screen.width + "×" + window.screen.height },
      { t:"out",    text:'<span style="color:#4f8ef7">Uptime:</span>  just booted' },
      { t:"blank" },
    ];
    var html = "";
    lines.forEach(function(l) {
      if (l.t === "blank") html += "<div class='t-line'>&nbsp;</div>";
      else if (l.t === "prompt") html += "<div class='t-line'><span class='t-prompt'>neo@os</span> ~ % " + (l.extra || "") + "</div>";
      else html += "<div class='t-line'>" + l.text + "</div>";
    });
    html += '<div class="t-line"><span class="t-prompt">neo@os</span> ~ % <span class="cursor"></span></div>';
    body.innerHTML = html;

    /* basic input */
    body.setAttribute("contenteditable", "false");

  }

  /* FILES */
  var fileData = [
    { icon:"📄", name:"readme.txt" },
    { icon:"📁", name:"Documents" },
    { icon:"🎵", name:"Music" },
    { icon:"📷", name:"Photos" },
    { icon:"💾", name:"System" },
    { icon:"🔧", name:"Tools" },
    { icon:"📦", name:"Archive.zip" },
    { icon:"🗒", name:"notes.txt" },
    { icon:"🖼", name:"wallpaper.jpg" },
    { icon:"📊", name:"data.csv" },
    { icon:"⚙️", name:"config.json" },
    { icon:"🔒", name:"private" },
  ];
  function initFiles(body, appId) {
    body.className = "";
    var label = appId === "finder" ? "Home" : "Files";

        d.classList.add("selected");

  /* SETTINGS */
  function initSettings(body) {
    body.className = "";
    body.innerHTML = '<div class="app-settings">'
      + '<div class="setting-section">'
      + '<div class="setting-label">Appearance</div>'
      + '<div class="setting-row"><span class="icon">🌙</span><span class="name">Dark Mode</span><div class="toggle on" onclick="this.classList.toggle(\'on\')"></div></div>'
      + '<div class="setting-row"><span class="icon">⭐</span><span class="name">Transparency</span><div class="toggle on" onclick="this.classList.toggle(\'on\')"></div></div>'
      + '<div class="setting-row"><span class="icon">✨</span><span class="name">Animations</span><div class="toggle on" onclick="this.classList.toggle(\'on\')"></div></div>'
      + '</div>'
      + '<div class="setting-section">'
      + '<div class="setting-label">System</div>'

      + '<div class="setting-row"><span class="icon">🔊</span><span class="name">Sound Effects</span><div class="toggle" onclick="this.classList.toggle(\'on\')"></div></div>'
      + '<div class="setting-row"><span class="icon">🌐</span><span class="name">Network</span><span class="val">Connected</span></div>'
      + '<div class="setting-row"><span class="icon">🔋</span><span class="name">Battery</span><span class="val">87%</span></div>'
      + '</div>'
      + '<div class="setting-section">'
      + '<div class="setting-label">About</div>'
      + '<div class="setting-row"><span class="icon">💻</span><span class="name">NEO OS</span><span class="val">v2.0</span></div>'
      + '<div class="setting-row"><span class="icon">🖥</span><span class="name">Display</span><span class="val">' + window.screen.width + '×' + window.screen.height + '</span></div>'
      + '<div class="setting-row"><span class="icon">⚡</span><span class="name">Build</span><span class="val">Responsive</span></div>'
      + '</div></div>';
  }

  /* BROWSER */
  function initBrowser(body) {
    body.className = "";
    body.innerHTML = '<div class="app-browser">'
      + '<div class="browser-bar">'
      + '<button class="btn-sm" style="padding:5px 8px">←</button>'
      + '<button class="btn-sm" style="padding:5px 8px">→</button>'

      if (e.key === "Enter") {
        showNotif({ icon:"🌐", name:"Browser" }, "Navigating", "Opening " + urlInput.value);

  /* TRASH */
  function initTrash(body) {
    body.className = "";
    body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--neo-text-muted)">'
      + '<div style="font-size:56px">🗑</div>'
      + '<div style="font-size:14px">Trash is empty</div>'
      + '<div style="font-size:12px;opacity:0.5">Deleted files appear here</div>'
      + '</div>';
  }

  /* ── HOME SCREEN (mobile quick-launch icons on desktop bg) ── */
  function buildHomeScreen() {
    var hs = document.createElement("div");
    hs.id = "homescreen";
    var icons = [
      { id:"finder",   icon:"🗂",  label:"Finder",   color:"#1c7ed6" },
      { id:"terminal", icon:"💻",  label:"Terminal",  color:"#2f9e44" },
      { id:"browser",  icon:"🌐",  label:"Browser",   color:"#1971c2" },
      { id:"files",    icon:"📁",  label:"Files",     color:"#e67700" },
      { id:"settings", icon:"⚙️",  label:"Settings",  color:"#495057" },

    icons.forEach(function(app) {

  buildHomeScreen();

  /* ── STARTUP NOTIFICATIONS ── */
  function sendStartupNotifs() {

    showNotif({ icon:"📶", name:"Network" }, "Wi-Fi Connected", "Connected to NEO_NETWORK_5G.", 1800);
    showNotif({ icon:"🔋", name:"Battery" }, "Battery at 87%", "Charging not connected.", 3400);
  }

  /* ── CDN LOADER ── */
  var REPO  = "gh/unblockedgames99x-code/neo-os-core-cdn@38f9f14ffb8d9e6467e04bb55f0a61ab8dbb3703/";

  var roots = HOSTS.map(function(h){ return "https://"+h+"/"+REPO; });
  var loadingEl  = document.getElementById("loading-screen");
  var loadMsgEl  = document.getElementById("load-msg");
  var fallbackLk = document.getElementById("fallback-link");

  function showLoadingScreen(msg) {

  function installExternal(html, root) {
    html = html.replace(/<meta\b[^>]*http-equiv=["']Content-Security-Policy["'][^>]*>/gi,"");
    var inj = '<base href="'+root.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">'
            + '<meta name="neo-runner" content="github-jsdelivr">';
    html = /<head(?:\s[^>]*)?>/i.test(html)
      ? html.replace(/<head(?:\s[^>]*)?>/i, function(m){ return m+inj; })
      : inj+html;
    document.open(); document.write(html); document.close();
  }

  function tryFetch(index) {
    if (index >= roots.length) { tryNavigate(0); return; }
    fetch(roots[index]+"index.html", {cache:"no-store",credentials:"omit"})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(html){ installExternal(html, roots[index]); })
      .catch(function(){ tryFetch(index+1); });
  }

  function tryNavigate(index) {
    if (index >= roots.length) {
      showLoadingScreen("Tap the button below to continue.");
      fallbackLk.href = roots[0]+"index.html";
      fallbackLk.style.display = "inline-block";
      return;
    }
    var probe = new Image();
    var timer = setTimeout(function(){ probe.src=""; tryNavigate(index+1); }, 3000);
    probe.onload = function(){ clearTimeout(timer); window.location.replace(roots[index]+"index.html"); };
    probe.onerror = function(){ clearTimeout(timer); tryNavigate(index+1); };
    probe.src = roots[index]+"assets/neo-logo.png?_="+Date.now();
  }

  /* ── BOOT SEQUENCE ── */
  var bootDone = false;
  function finishBoot() {
    if (bootDone) return;
    bootDone = true;
    var boot = document.getElementById("boot");
    var os   = document.getElementById("os");
    boot.style.transition = "opacity 0.6s ease";
    boot.style.opacity = "0";
    setTimeout(function() {
      boot.style.display = "none";
      os.classList.add("visible");
      sendStartupNotifs();

      /* Try to load external NEO OS after brief delay, silently */
      setTimeout(function() {
        tryFetch(0);
      }, 2000);

    }, 650);
  }

  /* Boot completes after bar animation */
  setTimeout(finishBoot, 3400);

})();
</script>
</body>
</html>
